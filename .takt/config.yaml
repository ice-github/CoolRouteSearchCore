piece: default
provider: codex
concurrency: 1
vcs_provider: github

piece_overrides:
  movements:
    implement:
      quality_gates:
        - "Run `uv sync --group dev` and verify dependency resolution succeeds"
        - "Run `uv run pytest` and verify all tests pass"
        - "Run `uv run python -m compileall gcom.py main.py administrative_division.py prefecture_bbox.py scripts playwright` and verify Python sources compile"
    fix:
      quality_gates:
        - "Run `uv sync --group dev` and verify dependency resolution succeeds"
        - "Run `uv run pytest` and verify all tests pass"
        - "Run `uv run python -m compileall gcom.py main.py administrative_division.py prefecture_bbox.py scripts playwright` and verify Python sources compile"
    ai_fix:
      quality_gates:
        - "Run `uv sync --group dev` and verify dependency resolution succeeds"
        - "Run `uv run pytest` and verify all tests pass"
        - "Run `uv run python -m compileall gcom.py main.py administrative_division.py prefecture_bbox.py scripts playwright` and verify Python sources compile"
