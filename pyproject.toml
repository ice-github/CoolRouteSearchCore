[project]
name = "coolroutesearchcore"
version = "0.1.0"
description = "Download JAXA G-Portal GCOM-C data from Python with Docker and Playwright."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "pillow>=12.1.0",
    "pyproj>=3.7.0",
    "pyshp>=2.3.1",
    "kaleido==0.2.1",
    "plotly>=6.3.0",
    "rasterio>=1.5.0",
    "shapely>=2.1.0",
    "requests>=2.32.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "integration: requires network, G-Portal credentials, and Docker",
]
filterwarnings = [
    "ignore:Dataset has no geotransform, gcps, or rpcs.*:rasterio.errors.NotGeoreferencedWarning",
]
